name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: Also check the database, TLS certificate and domain expiry
        type: boolean
        default: true
  push:
    branches-ignore: [main]
    paths:
      - scripts/uptime-check.sh
      - scripts/uptime-issue.sh
      - .github/workflows/uptime.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: Check artmuse.app
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      DEEP: ${{ (github.event_name == 'workflow_dispatch' && inputs.deep) || github.event.schedule == '41 */3 * * *' || github.event_name == 'push' }}
      MANAGE_ISSUES: ${{ github.event_name != 'push' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token (issues: write) is passed only to the issue step, not left in .git/config for the scripts.
          persist-credentials: false

      - name: Run checks
        id: check
        run: |
          args=()
          if [ "$DEEP" = "true" ]; then args+=(--deep); fi
          status=0
          scripts/uptime-check.sh "${args[@]}" > report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi

      # The run stays green while the site is down, so GitHub sends no "run failed" email every 15 minutes.
      # The issue is the alert: opened once per outage, then updated silently (scripts/uptime-issue.sh).
      - name: Keep the outage issue in step
        if: env.MANAGE_ISSUES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          if [ "$FAILED" = "true" ]; then outcome=failed; else outcome=ok; fi
          scripts/uptime-issue.sh "$outcome" report.md
